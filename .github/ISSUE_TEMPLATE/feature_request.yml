name: Feature request
description: Suggest an improvement or new capability
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The clearer you describe the problem you're solving,
        the more likely it is to land. "I'd like X" is fine; "Currently I have to do Y,
        which is painful because Z" is much better.

  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: What's the situation today? What hurts about it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't pick them.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Popup UI
        - Settings page
        - Pi-hole API client
        - Heuristics / scoring
        - i18n / translations
        - Build / packaging / AMO
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to related issues / discussion, etc.
